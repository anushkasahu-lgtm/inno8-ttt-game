<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="mode-select">
      <button id="pvp-btn" class="mode-btn active">2 Players</button>
      <button id="ai-btn" class="mode-btn">vs AI</button>
    </div>

    <div class="scoreboard">
      <div class="score-box player-x">
        <span class="score-label">Player X</span>
        <span id="score-x">0</span>
      </div>
      <div class="score-box ties">
        <span class="score-label">Ties</span>
        <span id="score-ties">0</span>
      </div>
      <div class="score-box player-o">
        <span class="score-label" id="label-o">Player O</span>
        <span id="score-o">0</span>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <div class="controls">
      <button id="restart-btn" class="control-btn">Restart Game</button>
      <button id="reset-score-btn" class="control-btn secondary">Reset Scores</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
